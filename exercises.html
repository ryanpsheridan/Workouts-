<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @font-face {
    font-family: "DM Sans";
    src: url("DMSans-VariableFont_opsz,wght.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "DM Sans";
    src: url("DMSans-Italic-VariableFont_opsz,wght.ttf") format("truetype");
    font-weight: 100 900;
    font-style: italic;
    font-display: swap;
  }

  :root {
    --bg: #e7eaf0;
    --surface: #ffffff;
    --ink: #12161d;
    --ink-2: #4c5465;
    --ink-3: #949cad;
    --line: #e7e9ef;
    --line-2: #eff1f5;
    --field: #f1f3f6;
    --field-active: #e8ebf0;
    --link: #2563eb;
    --link-soft: #eef4ff;
    --link-border: #d7e3fb;
    --link-soft-active: #e2ecfe;
    --nav-bg: rgba(231,234,240,0.86);
    --shadow: 0 1px 2px rgba(16,21,31,0.05), 0 4px 14px rgba(16,21,31,0.05);
    --font: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }

  :root[data-theme="dark"] { color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }

  :root[data-theme="dark"] {
    --bg: #0a0c11;
    --surface: #13171e;
    --ink: #eef1f7;
    --ink-2: #abb5c5;
    --ink-3: #737d8e;
    --line: #2d3441;
    --line-2: #232a34;
    --field: #262d3a;
    --field-active: #303947;
    --link: #6ea8ff;
    --link-soft: #172741;
    --link-border: #2f4a72;
    --link-soft-active: #203353;
    --nav-bg: rgba(10,12,17,0.85);
    --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 20px rgba(0,0,0,0.4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0c11;
      --surface: #13171e;
      --ink: #eef1f7;
      --ink-2: #abb5c5;
      --ink-3: #737d8e;
      --line: #2d3441;
      --line-2: #232a34;
      --field: #262d3a;
      --field-active: #303947;
      --link: #6ea8ff;
      --link-soft: #172741;
      --link-border: #2f4a72;
      --link-soft-active: #203353;
      --nav-bg: rgba(10,12,17,0.85);
      --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 20px rgba(0,0,0,0.4);
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); color: var(--ink); }

  body {
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: 3rem;
    -webkit-text-size-adjust: 100%;
  }

  a { color: var(--link); }

  /* ---------- Header ---------- */
  .app-header { position: relative; z-index: 41; padding: calc(1.6rem + env(safe-area-inset-top)) 1.25rem 0.9rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .app-header h1 { font-size: 22px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; text-transform: lowercase; }
  .back-link {
    flex: none; width: 34px; height: 34px; display: grid; place-items: center;
    color: var(--ink); -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .back-link:active { transform: scale(0.9); opacity: 0.7; }
  .back-link svg { width: 20px; height: 20px; }
  .header-left { flex: none; display: flex; align-items: center; gap: 10px; }

  /* ---------- Search ---------- */
  .search-wrap {
    position: sticky; top: 0; z-index: 20;
    padding: calc(11px + env(safe-area-inset-top)) 1.25rem 11px;
    background: var(--nav-bg);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .search-wrap.stuck { padding-top: 11px; }
  .search-box {
    position: relative; display: flex; align-items: center;
  }
  .search-box svg {
    position: absolute; left: 13px; width: 16px; height: 16px; color: var(--ink-3); pointer-events: none;
  }
  #search {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
    background: var(--field); border: 1px solid var(--line); border-radius: 11px;
    padding: 11px 13px 11px 37px; -webkit-appearance: none; appearance: none;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  #search:focus { outline: none; background: var(--surface); border-color: var(--link-border); }
  #search::placeholder { color: var(--ink-3); }
  #search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .clear-search {
    position: absolute; right: 8px; width: 26px; height: 26px; border: none; background: none;
    color: var(--ink-3); display: none; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .clear-search.show { display: grid; }
  .clear-search svg { width: 15px; height: 15px; }

  /* ---------- Category chips ---------- */
  .chip-row {
    display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
    padding: 10px 1.25rem 2px; margin: 0 -1.25rem;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip-row::before, .chip-row::after { content: ""; flex: none; width: 1px; }
  .chip {
    flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); font-family: inherit; font-size: 12.5px; font-weight: 400;
    color: var(--ink-2); cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .chip:active { transform: scale(0.96); }
  .chip.active { border-color: transparent; color: #fff; }

  /* ---------- Result count ---------- */
  .result-count { padding: 14px 1.25rem 4px; font-size: 12px; color: var(--ink-3); }

  /* ---------- Alphabet list ---------- */
  main { padding: 0 1.25rem; }
  .letter-group { margin-top: 4px; }
  .letter-head {
    position: sticky; top: 62px; z-index: 10;
    padding: 7px 2px; font-family: var(--mono); font-size: 12px; font-weight: 400;
    color: var(--ink-3); background: var(--bg);
  }

  .ex-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 1.1rem 1.15rem; margin-bottom: 10px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .ex-card-name { font-size: 17px; font-weight: 650; letter-spacing: -0.015em; color: var(--ink); word-break: break-word; }
  .ex-card-note {
    font-size: 13.5px; color: var(--ink-2); margin-top: 5px; line-height: 1.5;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .ex-card-note.open { display: block; -webkit-line-clamp: none; overflow: visible; }
  .ex-card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 10px; }
  .ex-tag {
    display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 8px;
    font-size: 10.5px; font-weight: 400; letter-spacing: 0.02em; color: #fff; white-space: nowrap;
  }
  .ex-tag.warmup { background: var(--ink-3); }
  .ex-reps {
    display: inline-flex; align-items: center; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--field); font-size: 10.5px; font-weight: 400;
    letter-spacing: 0.02em; color: var(--ink-2); white-space: nowrap;
  }
  .ex-demo {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 9px; border: 1px solid var(--link-border); border-radius: 8px;
    background: var(--link-soft); font-size: 10.5px; font-weight: 400; letter-spacing: 0.02em;
    color: var(--link); text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  .ex-demo::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 4px 0 4px 6.5px; border-color: transparent transparent transparent var(--link); }
  .ex-demo:active { background: var(--link-soft-active); }

  .empty-state { padding: 3rem 1.25rem; text-align: center; color: var(--ink-3); font-size: 14px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <a class="back-link" href="index.html" aria-label="Back to program">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>exercise library</h1>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Search exercises..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="clear-search" id="clear-search" aria-label="Clear search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="chip-row" id="chip-row"></div>
</div>

<div class="result-count" id="result-count"></div>
<main id="content"></main>

<script src="workout-data.js"></script>
<script>
// Builds a de-duplicated library from the same WARMUPS/DAYS data the program page
// uses, so this list can never drift out of sync with the actual workouts.
const CATS = [
  { id: "all", label: "All", color: "#4c5465" },
  { id: "warmup", label: "Warm-ups", color: "#949cad" },
  ...DAYS.map(d => ({ id: d.id, label: d.label, color: d.color }))
];

function buildLibrary() {
  const byName = new Map();

  function addRow(r, cat) {
    const key = r.ex;
    let entry = byName.get(key);
    if (!entry) {
      entry = { name: r.ex, note: r.note || "", link: r.link || "", reps: new Set(), cats: new Map() };
      byName.set(key, entry);
    }
    if (!entry.note && r.note) entry.note = r.note;
    if (!entry.link && r.link) entry.link = r.link;
    if (r.rp) entry.reps.add(r.rp);
    if (!entry.cats.has(cat.id)) entry.cats.set(cat.id, cat);
  }

  Object.keys(WARMUPS).forEach(dayId => {
    const cat = CATS.find(c => c.id === "warmup");
    WARMUPS[dayId].forEach(r => addRow(r, cat));
  });
  DAYS.forEach(d => {
    const cat = CATS.find(c => c.id === d.id);
    d.phases.forEach(p => p.rows.forEach(r => addRow(r, cat)));
  });

  return [...byName.values()].sort((a, b) => a.name.localeCompare(b.name));
}

const LIBRARY = buildLibrary();
let activeCat = "all";
let query = "";

function exCardHtml(item) {
  const reps = [...item.reps].slice(0, 2).map(r => `<span class="ex-reps">${r}</span>`).join("");
  const demo = item.link ? `<a class="ex-demo" href="${item.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Demo</a>` : "";
  const tags = [...item.cats.values()]
    .sort((a, b) => (a.id === "warmup" ? -1 : b.id === "warmup" ? 1 : 0))
    .map(c => `<span class="ex-tag${c.id === "warmup" ? " warmup" : ""}" style="${c.color && c.id !== "warmup" ? `background:${c.color}` : ""}">${c.label}</span>`)
    .join("");
  const note = item.note ? `<div class="ex-card-note">${item.note}</div>` : "";
  return `<div class="ex-card" data-note-toggle>
    <div class="ex-card-name">${item.name}</div>
    ${note}
    <div class="ex-card-meta">${reps}${tags}${demo}</div>
  </div>`;
}

function render() {
  const q = query.trim().toLowerCase();
  const filtered = LIBRARY.filter(item => {
    if (activeCat !== "all" && !item.cats.has(activeCat)) return false;
    if (!q) return true;
    return item.name.toLowerCase().includes(q) || item.note.toLowerCase().includes(q);
  });

  document.getElementById("result-count").textContent =
    filtered.length ? `${filtered.length} exercise${filtered.length === 1 ? "" : "s"}` : "";

  if (!filtered.length) {
    document.getElementById("content").innerHTML = `<div class="empty-state">No exercises match "${query}"</div>`;
    return;
  }

  const groups = [];
  filtered.forEach(item => {
    const letter = /[a-z]/i.test(item.name[0]) ? item.name[0].toUpperCase() : "#";
    let group = groups[groups.length - 1];
    if (!group || group.letter !== letter) {
      group = { letter, items: [] };
      groups.push(group);
    }
    group.items.push(item);
  });

  document.getElementById("content").innerHTML = groups.map(g => `
    <div class="letter-group">
      <div class="letter-head">${g.letter}</div>
      ${g.items.map(exCardHtml).join("")}
    </div>
  `).join("");
}

function renderChips() {
  document.getElementById("chip-row").innerHTML = CATS.map(c =>
    `<button class="chip${c.id === activeCat ? " active" : ""}" data-cat="${c.id}" style="${c.id === activeCat && c.color ? `background:${c.color}` : ""}">${c.label}</button>`
  ).join("");
}

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value;
  document.getElementById("clear-search").classList.toggle("show", !!query);
  render();
});

document.getElementById("clear-search").addEventListener("click", () => {
  query = "";
  const input = document.getElementById("search");
  input.value = "";
  input.focus();
  document.getElementById("clear-search").classList.remove("show");
  render();
});

document.getElementById("chip-row").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  activeCat = chip.dataset.cat;
  renderChips();
  render();
});

document.getElementById("content").addEventListener("click", e => {
  const card = e.target.closest(".ex-card");
  if (!card) return;
  const note = card.querySelector(".ex-card-note");
  if (note) note.classList.toggle("open");
});

renderChips();
render();
</script>
</body>
</html>
