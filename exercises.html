<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @font-face {
    font-family: "DM Sans";
    src: url("DMSans-VariableFont_opsz,wght.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "DM Sans";
    src: url("DMSans-Italic-VariableFont_opsz,wght.ttf") format("truetype");
    font-weight: 100 900;
    font-style: italic;
    font-display: swap;
  }

  :root {
    --bg: #0a0c11;
    --surface: #13171e;
    --ink: #eef1f7;
    --ink-2: #abb5c5;
    --ink-3: #737d8e;
    --line: #2d3441;
    --line-2: #232a34;
    --field: #262d3a;
    --field-active: #303947;
    --link: #6ea8ff;
    --link-soft: #172741;
    --link-border: #2f4a72;
    --link-soft-active: #203353;
    --nav-bg: rgba(10,12,17,0.85);
    --shadow: 0 1px 2px rgba(0,0,0,0.5), 0 8px 20px rgba(0,0,0,0.4);
    --font: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); color: var(--ink); }

  body {
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: 3rem;
    -webkit-text-size-adjust: 100%;
  }

  a { color: var(--link); }

  /* ---------- Header ---------- */
  .app-header { position: relative; z-index: 41; padding: calc(1.6rem + env(safe-area-inset-top)) 1.25rem 0.9rem; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .app-header h1 { font-size: 22px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; text-transform: lowercase; }
  .back-link {
    flex: none; width: 34px; height: 34px; display: grid; place-items: center;
    color: var(--ink); -webkit-tap-highlight-color: transparent;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .back-link:active { transform: scale(0.9); opacity: 0.7; }
  .back-link svg { width: 20px; height: 20px; }
  .header-left { flex: none; display: flex; align-items: center; gap: 10px; }

  /* ---------- Search ---------- */
  .search-wrap {
    position: sticky; top: 0; z-index: 20;
    padding: calc(11px + env(safe-area-inset-top)) 1.25rem 11px;
    background: var(--nav-bg);
    -webkit-backdrop-filter: saturate(180%) blur(12px);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .search-wrap.stuck { padding-top: 11px; }
  .search-box {
    position: relative; display: flex; align-items: center;
  }
  .search-box svg {
    position: absolute; left: 13px; width: 16px; height: 16px; color: var(--ink-3); pointer-events: none;
  }
  #search {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
    background: var(--field); border: 1px solid var(--line); border-radius: 11px;
    padding: 11px 13px 11px 37px; -webkit-appearance: none; appearance: none;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  #search:focus { outline: none; background: var(--surface); border-color: var(--link-border); }
  #search::placeholder { color: var(--ink-3); }
  #search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .clear-search {
    position: absolute; right: 8px; width: 26px; height: 26px; border: none; background: none;
    color: var(--ink-3); display: none; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .clear-search.show { display: grid; }
  .clear-search svg { width: 15px; height: 15px; }

  /* ---------- Category chips ---------- */
  .chip-row {
    display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
    padding: 10px 1.25rem 2px; margin: 0 -1.25rem;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip-row::before, .chip-row::after { content: ""; flex: none; width: 1px; }
  .chip {
    flex: none; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--surface); font-family: inherit; font-size: 12.5px; font-weight: 400;
    color: var(--ink-2); cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .chip:active { transform: scale(0.96); }
  .chip.active { border-color: transparent; color: #fff; }

  /* ---------- Result count ---------- */
  .result-count { padding: 14px 1.25rem 4px; font-size: 12px; color: var(--ink-3); }

  /* ---------- Alphabet list ---------- */
  main { padding: 0 1.25rem; }
  .letter-group { margin-top: 4px; }
  .letter-head {
    position: sticky; top: 62px; z-index: 10;
    display: flex; align-items: baseline; gap: 6px;
    padding: 7px 2px; font-family: var(--mono); font-size: 12px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-3); background: var(--bg);
  }
  .letter-count { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ink-3); }

  .ex-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 1.1rem 1.15rem; margin-bottom: 10px;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .ex-card-name { font-size: 17px; font-weight: 650; letter-spacing: -0.015em; color: var(--ink); word-break: break-word; }
  .ex-card-note {
    font-size: 13.5px; color: var(--ink-2); margin-top: 5px; line-height: 1.5;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .ex-card-note.open { display: block; -webkit-line-clamp: none; overflow: visible; }
  .ex-card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 10px; }
  .ex-tag {
    display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 8px;
    font-size: 10.5px; font-weight: 400; letter-spacing: 0.02em; color: #fff; white-space: nowrap;
  }
  .ex-reps {
    display: inline-flex; align-items: center; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--field); font-size: 10.5px; font-weight: 400;
    letter-spacing: 0.02em; color: var(--ink-2); white-space: nowrap;
  }
  .ex-demo {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 9px; border: 1px solid var(--link-border); border-radius: 8px;
    background: var(--link-soft); font-size: 10.5px; font-weight: 400; letter-spacing: 0.02em;
    color: var(--link); text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  .ex-demo::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 4px 0 4px 6.5px; border-color: transparent transparent transparent var(--link); }
  .ex-demo:active { background: var(--link-soft-active); }

  .empty-state { padding: 3rem 1.25rem; text-align: center; color: var(--ink-3); font-size: 14px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <a class="back-link" href="index.html" aria-label="Back to program">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>exercise library</h1>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Search exercises..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="clear-search" id="clear-search" aria-label="Clear search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="chip-row" id="chip-row"></div>
</div>

<div class="result-count" id="result-count"></div>
<main id="content"></main>

<script src="workout-data.js"></script>
<script>
// Builds a de-duplicated library from the same WARMUPS/DAYS data the program page
// uses, so this list can never drift out of sync with the actual workouts.
// Organized by movement pattern rather than by workout day, since that's how you'd
// actually browse a library of exercises to reference ("give me a push move").
const TYPES = [
  { id: "push", label: "Push", color: "#c2410c" },
  { id: "pull", label: "Pull", color: "#15803d" },
  { id: "legs", label: "Legs", color: "#7c3aed" },
  { id: "core", label: "Core", color: "#a16207" },
  { id: "mobility", label: "Mobility", color: "#0e7490" },
  { id: "conditioning", label: "Conditioning", color: "#dc2626" }
];
const TYPE_BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));

// Every exercise name in WARMUPS/DAYS, classified by primary movement pattern.
const EX_TYPE = {
  "90/90 Hip Lift-Off": "mobility",
  "90/90 Hip Switches": "mobility",
  "Adductor Rocks": "mobility",
  "Air Squats": "legs",
  "Alternating Incline Curl-to-Press": "push",
  "Band Pull-Aparts": "pull",
  "Banded Hamstring Pulls OR Light RDL (bar only)": "legs",
  "Bird-Dogs": "core",
  "Box Jumps": "legs",
  "Bretzel": "mobility",
  "Broad Jumps": "legs",
  "Butterfly Stretch": "mobility",
  "Calf Raises OR Lateral Band Walks": "legs",
  "Center Split Stretch": "mobility",
  "Chin-Ups": "pull",
  "Cossack Squats": "legs",
  "Couch Stretch": "mobility",
  "Dead Bug": "core",
  "Dead Hang": "pull",
  "Easy Bike or Rower": "conditioning",
  "Easy Bike or Walk": "conditioning",
  "Explosive / Plyo Push-Ups": "push",
  "Farmer's Carry": "core",
  "Feet-Elevated Push-Ups (feet on box)": "push",
  "Foam Roll Hamstrings": "mobility",
  "Foam Roll Mid Back": "mobility",
  "Foam Roll Thoracic Extensions": "mobility",
  "Foam Roll Upper Back & Lats": "mobility",
  "GHD Reverse Hyperextension": "core",
  "GHD Sit-Ups": "core",
  "Half-Kneeling Cable Chop (High-to-Low)": "core",
  "Half-Kneeling Landmine Press": "push",
  "Hammer Curls": "pull",
  "Hanging Leg Raise": "core",
  "Hanging Leg Raise OR Captain's Chair Knee Raise": "core",
  "Hanging Leg or Knee Raise": "core",
  "Hanging TRX Row": "pull",
  "Heavy Sled Push OR Weighted Step-Ups (fast tempo)": "conditioning",
  "Hip Airplanes": "mobility",
  "Hip Internal Rotation Stretch": "mobility",
  "Lateral Band Walks": "legs",
  "Leg Swings (Front-to-Back)": "mobility",
  "Log the rounds you held and the scale you used": "conditioning",
  "Lying Plate Pass": "core",
  "Med Ball Perpendicular Throw": "core",
  "Med Ball Rotational Slam OR Cable Rotational Chop": "core",
  "Med Ball Slams": "conditioning",
  "Offset Step-Ups": "legs",
  "Open Books": "mobility",
  "Overhead Tricep Extension (rope)": "push",
  "Pallof Press (with hold)": "core",
  "Pull-Up Giant Set": "pull",
  "Pull-Ups": "pull",
  "Pull-Ups (pick your scale)": "pull",
  "Push-Ups": "push",
  "Push-Ups (pick your scale)": "push",
  "Scapular Pull-Ups": "pull",
  "Shoulder CARs": "mobility",
  "Side Plank (top leg raised)": "core",
  "Single-Leg DB RDL": "legs",
  "Single-Leg Glute Bridge (2 sec hold)": "legs",
  "Single-Leg Press (Machine)": "legs",
  "Skater Bounds": "legs",
  "Sled Push (Forward + Backward) OR Heavy Kettlebell Swings": "conditioning",
  "Smith Machine Lunges OR Hack Squat": "legs",
  "Standing Band Raises": "push",
  "Swimming Circles": "core",
  "TRX Bicep Curl": "pull",
  "TRX Chest Opener": "mobility",
  "TRX Fallout OR GHD Sit-Ups": "core",
  "TRX Y-Fly": "pull",
  "TRX Y-Fly OR Prone Y Raise": "pull",
  "Thoracic Rotations": "mobility",
  "Thoracic Rotations (Quadruped)": "mobility",
  "Toe Rockback to Deep Squat": "mobility",
  "Twisting Lunges with 45 lb plate": "legs",
  "Upper Trap + Levator Stretch": "mobility",
  "Walking Lunges": "legs",
  "Walking Lunges with a Twist": "legs",
  "Wall Angels": "mobility",
  "Wall Hip Flexor Stretch": "mobility",
  "World's Greatest Stretch": "mobility",
  "Wrist Flexor Stretch": "mobility",
  "Wrist Rocks": "mobility"
};

function buildLibrary() {
  const byName = new Map();

  function addRow(r) {
    const key = r.ex;
    let entry = byName.get(key);
    if (!entry) {
      entry = { name: r.ex, note: r.note || "", link: r.link || "", reps: new Set(), type: EX_TYPE[r.ex] || "core" };
      byName.set(key, entry);
    }
    if (!entry.note && r.note) entry.note = r.note;
    if (!entry.link && r.link) entry.link = r.link;
    if (r.rp) entry.reps.add(r.rp);
  }

  Object.keys(WARMUPS).forEach(dayId => WARMUPS[dayId].forEach(addRow));
  DAYS.forEach(d => d.phases.forEach(p => p.rows.forEach(addRow)));

  return [...byName.values()].sort((a, b) => a.name.localeCompare(b.name));
}

const LIBRARY = buildLibrary();
let activeType = "all";
let query = "";

function exCardHtml(item, showTag) {
  const reps = [...item.reps].slice(0, 2).map(r => `<span class="ex-reps">${r}</span>`).join("");
  const demo = item.link ? `<a class="ex-demo" href="${item.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Demo</a>` : "";
  const t = TYPE_BY_ID[item.type];
  const tag = showTag ? `<span class="ex-tag" style="background:${t.color}">${t.label}</span>` : "";
  const note = item.note ? `<div class="ex-card-note">${item.note}</div>` : "";
  return `<div class="ex-card" data-note-toggle>
    <div class="ex-card-name">${item.name}</div>
    ${note}
    <div class="ex-card-meta">${reps}${tag}${demo}</div>
  </div>`;
}

function render() {
  const q = query.trim().toLowerCase();
  const filtered = LIBRARY.filter(item => {
    if (activeType !== "all" && item.type !== activeType) return false;
    if (!q) return true;
    return item.name.toLowerCase().includes(q) || item.note.toLowerCase().includes(q);
  });

  document.getElementById("result-count").textContent =
    filtered.length ? `${filtered.length} exercise${filtered.length === 1 ? "" : "s"}` : "";

  if (!filtered.length) {
    document.getElementById("content").innerHTML = `<div class="empty-state">No exercises match "${query}"</div>`;
    return;
  }

  // Searching flattens to a relevance-free alphabetical list (mixed types, so each
  // card carries its type tag). Browsing groups by movement pattern - the point of
  // a library is finding "a push move" or "a core move", not scanning A-Z.
  if (q) {
    document.getElementById("content").innerHTML =
      `<div class="letter-group">${filtered.map(item => exCardHtml(item, true)).join("")}</div>`;
    return;
  }

  const types = activeType === "all" ? TYPES : TYPES.filter(t => t.id === activeType);
  const sections = types.map(t => {
    const items = filtered.filter(item => item.type === t.id);
    if (!items.length) return "";
    return `<div class="letter-group">
      <div class="letter-head" style="color:${t.color}">${t.label} <span class="letter-count">${items.length}</span></div>
      ${items.map(item => exCardHtml(item, false)).join("")}
    </div>`;
  }).join("");

  document.getElementById("content").innerHTML = sections;
}

function renderChips() {
  const chips = [{ id: "all", label: "All", color: "#4c5465" }, ...TYPES];
  document.getElementById("chip-row").innerHTML = chips.map(c =>
    `<button class="chip${c.id === activeType ? " active" : ""}" data-type="${c.id}" style="${c.id === activeType ? `background:${c.color}` : ""}">${c.label}</button>`
  ).join("");
}

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value;
  document.getElementById("clear-search").classList.toggle("show", !!query);
  render();
});

document.getElementById("clear-search").addEventListener("click", () => {
  query = "";
  const input = document.getElementById("search");
  input.value = "";
  input.focus();
  document.getElementById("clear-search").classList.remove("show");
  render();
});

document.getElementById("chip-row").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  activeType = chip.dataset.type;
  renderChips();
  render();
});

document.getElementById("content").addEventListener("click", e => {
  const card = e.target.closest(".ex-card");
  if (!card) return;
  const note = card.querySelector(".ex-card-note");
  if (note) note.classList.toggle("open");
});

renderChips();
render();
</script>
</body>
</html>
