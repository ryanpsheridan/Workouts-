<style>
  @font-face {
    font-family: "DM Sans";
    src: url("DMSans-VariableFont_opsz,wght.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #000;
    --s1: #0d0e10;            /* card */
    --s2: #16181b;            /* raised control */
    --s3: #202328;            /* pressed */
    --line: rgba(255,255,255,0.07);
    --line-2: rgba(255,255,255,0.12);
    --ink: #f4f5f7;
    --ink-2: #a4a9b2;
    --ink-3: #6c717a;
    --lower: #c8f25a;
    --upper: #7cc4ff;
    --golf: #f2c46d;
    --a: var(--lower);        /* accent of whatever is on screen */
    --on-a: #0a0b0c;
    --r-lg: 24px;
    --r-md: 18px;
    --top-h: calc(52px + env(safe-area-inset-top));
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    --font: "DM Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 15px; line-height: 1.45;
    font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
    min-height: 100dvh; touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  button, a, .tap { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--a); outline-offset: 3px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; }

  #app { max-width: 560px; margin: 0 auto; }

  /* ---------- View transitions (Safari 18+) with a plain fade-up fallback ---------- */
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.34s; animation-timing-function: var(--ease); }
  html.vt-fwd::view-transition-old(root) { animation-name: vt-out-l; }
  html.vt-fwd::view-transition-new(root) { animation-name: vt-in-r; }
  html.vt-back::view-transition-old(root) { animation-name: vt-out-r; }
  html.vt-back::view-transition-new(root) { animation-name: vt-in-l; }
  @keyframes vt-in-r { from { transform: translateX(28%); opacity: 0; } }
  @keyframes vt-out-l { to { transform: translateX(-10%); opacity: 0; } }
  @keyframes vt-in-l { from { transform: translateX(-10%); opacity: 0; } }
  @keyframes vt-out-r { to { transform: translateX(28%); opacity: 0; } }
  .enter { animation: enter 0.32s var(--ease); }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after, ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) {
      animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important;
    }
  }

  /* =====================================================================
     HOME
     ===================================================================== */
  .home { padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px); }
  .h-top { display: flex; align-items: center; justify-content: space-between; height: 32px; }
  .wordmark { font-size: 17px; font-weight: 500; letter-spacing: -0.03em; }
  .wordmark b { color: var(--a); font-weight: 500; }
  .h-date { font-size: 13px; color: var(--ink-3); letter-spacing: 0.01em; }
  .h-greet { font-size: 40px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; margin: 26px 0 18px; }

  /* Up-next hero: the one thing the home screen exists to answer */
  .hero {
    position: relative; display: block; overflow: hidden; isolation: isolate;
    border-radius: 28px; padding: 22px 22px 20px; min-height: 236px;
    background: var(--s1); border: 1px solid var(--line);
    transition: transform 0.18s var(--ease);
  }
  .hero:active { transform: scale(0.985); }
  .hero::before {
    content: ""; position: absolute; inset: -40% -30% auto auto; width: 120%; aspect-ratio: 1; z-index: -1;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--a) 34%, transparent), transparent 72%);
    filter: blur(8px); opacity: 0.85;
  }
  .hero::after {
    content: attr(data-letter); position: absolute; right: -6px; bottom: -42px; z-index: -1;
    font-size: 210px; font-weight: 800; letter-spacing: -0.08em; line-height: 1;
    color: transparent; -webkit-text-stroke: 1.5px color-mix(in srgb, var(--a) 40%, transparent);
  }
  .kicker { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--a); }
  .kicker i { width: 6px; height: 6px; border-radius: 50%; background: var(--a); box-shadow: 0 0 10px var(--a); }
  .hero-title { font-size: 46px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; margin-top: 14px; }
  .hero-focus { font-size: 15px; color: var(--ink-2); margin-top: 8px; max-width: 78%; line-height: 1.35; }
  .hero-foot { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 26px; gap: 12px; }
  .hero-stats { display: flex; gap: 18px; }
  .stat b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
  .stat span { font-size: 11.5px; color: var(--ink-3); letter-spacing: 0.02em; }
  .go {
    flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
    background: var(--a); color: var(--on-a); box-shadow: 0 8px 28px color-mix(in srgb, var(--a) 35%, transparent);
  }
  .go svg { width: 22px; height: 22px; }
  .hero-done { margin-top: 10px; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .hero-done svg { width: 15px; height: 15px; color: var(--a); }

  /* Week strip */
  .week { margin-top: 14px; padding: 16px 16px 14px; border-radius: var(--r-lg); background: var(--s1); border: 1px solid var(--line); }
  .week-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
  .week-count { font-size: 13px; color: var(--ink-2); }
  .week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .wd { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-3); }
  .wd-dot {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--s2); font-size: 12px; font-weight: 700; color: var(--on-a);
  }
  .wd.today { color: var(--ink); }
  .wd.today .wd-dot { box-shadow: inset 0 0 0 1.5px var(--ink-2); }
  .wd.future .wd-dot { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
  .wd.on .wd-dot { box-shadow: none; }

  /* Session grid */
  .group-h { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 4px 10px; }
  .group-h h2 { font-size: 22px; font-weight: 650; letter-spacing: -0.035em; }
  .group-h span { font-size: 12.5px; color: var(--ink-3); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 176px;
    padding: 16px; border-radius: var(--r-lg); background: var(--s1); border: 1px solid var(--line);
    transition: transform 0.16s var(--ease), background-color 0.16s ease;
  }
  .card:active { transform: scale(0.97); background: var(--s2); }
  .card-letter { font-size: 52px; font-weight: 700; letter-spacing: -0.06em; line-height: 0.9; color: var(--a); }
  .card-focus { font-size: 13px; color: var(--ink-2); line-height: 1.35; margin-top: 12px; flex: 1; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 11.5px; color: var(--ink-3); }
  .badge { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; border-radius: 99px; background: var(--a); color: var(--on-a); }
  .card.golf { flex-direction: row; align-items: center; gap: 14px; min-height: 0; padding: 16px; }
  .golf-ico { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--a) 16%, transparent); color: var(--a); }
  .golf-ico svg { width: 24px; height: 24px; }
  .golf-txt { flex: 1; min-width: 0; }
  .golf-txt b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .golf-txt span { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.35; }
  .chev-r { flex: none; width: 16px; height: 16px; color: var(--ink-3); }

  /* Links list */
  .list { border-radius: var(--r-lg); background: var(--s1); border: 1px solid var(--line); overflow: hidden; }
  .li { display: flex; align-items: center; gap: 14px; padding: 15px 16px; font-size: 16px; transition: background-color 0.12s ease; }
  .li + .li { border-top: 1px solid var(--line); }
  .li:active { background: var(--s2); }
  .li-ico { flex: none; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--s2); color: var(--ink-2); }
  .li-ico svg { width: 17px; height: 17px; }
  .li > span:not(.li-ico) { flex: 1; }

  /* =====================================================================
     SESSION
     ===================================================================== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30; height: var(--top-h);
    padding: env(safe-area-inset-top) 8px 0;
    display: flex; align-items: center; gap: 6px;
    transition: background-color 0.2s ease, border-color 0.2s ease;
    border-bottom: 1px solid transparent;
  }
  .topbar.scrolled {
    background: rgba(0,0,0,0.86); border-bottom-color: var(--line);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  .topbar-in { max-width: 560px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 6px; }
  .back {
    flex: none; height: 40px; padding: 0 12px 0 6px; border-radius: 20px; display: flex; align-items: center; gap: 2px;
    font-size: 16px; color: var(--ink); transition: background-color 0.12s ease;
  }
  .back:active { background: var(--s2); }
  .back svg { width: 24px; height: 24px; }
  .tb-title { flex: 1; text-align: center; font-size: 16px; font-weight: 600; letter-spacing: -0.02em; opacity: 0; transform: translateY(6px); transition: opacity 0.2s ease, transform 0.2s var(--ease); }
  .topbar.titled .tb-title { opacity: 1; transform: none; }
  .tb-right { flex: none; min-width: 78px; text-align: right; padding-right: 10px; font-size: 13px; color: var(--ink-2); }

  .session { padding: var(--top-h) 0 calc(env(safe-area-inset-bottom) + 120px); position: relative; }
  .s-glow {
    position: absolute; top: 0; left: 0; right: 0; height: 360px; z-index: -1; pointer-events: none;
    background: radial-gradient(90% 70% at 85% 0%, color-mix(in srgb, var(--a) 22%, transparent), transparent 70%);
  }
  .s-hero { padding: 12px 20px 6px; }
  .s-title { font-size: 44px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; margin-top: 10px; }
  .s-focus { font-size: 16px; color: var(--ink-2); margin-top: 8px; line-height: 1.35; }
  .s-stats { display: flex; gap: 22px; margin-top: 20px; }

  /* Section jump bar: sticky under the top bar, follows the scroll */
  .jump {
    position: sticky; top: var(--top-h); z-index: 20; margin-top: 18px;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 16px;
    background: rgba(0,0,0,0.86); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  }
  .jump::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 34px; padding: 0 14px; border-radius: 17px; font-size: 13.5px; font-weight: 500;
    color: var(--ink-2); background: var(--s2); white-space: nowrap;
    transition: background-color 0.2s ease, color 0.2s ease, transform 0.12s ease;
  }
  .chip:active { transform: scale(0.95); }
  .chip.on { background: var(--ink); color: #000; }

  .sec { padding: 26px 16px 0; scroll-margin-top: calc(var(--top-h) + 58px); }
  .sec-h { display: flex; align-items: baseline; gap: 10px; padding: 0 4px; }
  .sec-n { font-size: 13px; font-weight: 600; color: var(--a); font-variant-numeric: tabular-nums; }
  .sec-h h3 { flex: 1; font-size: 22px; font-weight: 650; letter-spacing: -0.035em; }
  .sec-c { font-size: 12.5px; color: var(--ink-3); }
  .sec-sub {
    margin: 10px 4px 0; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.4; color: var(--ink-2);
    background: color-mix(in srgb, var(--a) 7%, var(--s1)); border: 1px solid color-mix(in srgb, var(--a) 16%, transparent);
  }
  .grps { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .grp { border-radius: var(--r-md); background: var(--s1); border: 1px solid var(--line); padding: 4px 0; position: relative; }
  .grp-tag { display: flex; align-items: center; gap: 8px; padding: 12px 16px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
  .grp-tag::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  /* Rail linking the A/B/C bubbles of a superset so it reads as one unit */
  .grp.multi .ex:not(:last-child) .ex-idx::after {
    content: ""; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 400px; transform: translateX(-50%);
    background: linear-gradient(var(--line-2), var(--line-2)); z-index: -1;
  }
  .grp.multi .ex { overflow: hidden; }

  .ex { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px 14px 14px 14px; position: relative; isolation: isolate; }
  .ex + .ex { border-top: 1px solid transparent; }
  .ex-idx {
    position: relative; width: 34px; height: 34px; border-radius: 50%; margin-top: 1px;
    display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: var(--ink-2);
    background: var(--s2); box-shadow: inset 0 0 0 1px var(--line-2);
    transition: background-color 0.18s ease, color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
  }
  .ex-idx:active { transform: scale(0.88); }
  .ex-idx svg { display: none; width: 16px; height: 16px; }
  .ex.done .ex-idx { background: var(--a); color: var(--on-a); box-shadow: none; animation: pop 0.26s var(--ease); }
  .ex.done .ex-idx span { display: none; }
  .ex.done .ex-idx svg { display: block; }
  .ex.done .ex-main { opacity: 0.4; }
  @keyframes pop { 50% { transform: scale(1.14); } }
  .ex-main { min-width: 0; transition: opacity 0.2s ease; }
  .ex-top { display: flex; gap: 10px; align-items: flex-start; }
  .ex-name { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; padding-top: 6px; }
  .ex-alt { display: block; font-size: 13px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; margin-top: 2px; }
  .play {
    flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    background: var(--s2); color: var(--ink); transition: transform 0.12s ease, background-color 0.12s ease;
  }
  .play:active { transform: scale(0.9); background: var(--s3); }
  .play svg { width: 13px; height: 13px; margin-left: 2px; }
  .ex-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 6px; }
  .reps { font-size: 15px; font-weight: 600; color: var(--a); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; margin-right: 2px; }
  .cue { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; color: var(--ink-2); background: var(--s2); white-space: nowrap; }
  .cue::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--a); opacity: 0.8; }
  .ex-note {
    margin-top: 7px; font-size: 14px; line-height: 1.45; color: var(--ink-2);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .ex-note.open { display: block; -webkit-line-clamp: unset; }

  /* Warm-up: one compact card, notes clipped to one line so it reads as a quick list */
  .grp.warm .ex { padding-top: 10px; padding-bottom: 10px; }
  .grp.warm .ex + .ex { border-top-color: var(--line); }
  .grp.warm .ex-name { font-size: 15.5px; padding-top: 7px; }
  .grp.warm .reps { font-size: 14px; }
  .grp.warm .ex-note { -webkit-line-clamp: 1; font-size: 13px; margin-top: 4px; }
  .grp.warm .ex-note.open { -webkit-line-clamp: unset; }

  /* Bottom action bar */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 18px 16px calc(env(safe-area-inset-bottom) + 12px);
    background: linear-gradient(to top, #000 55%, rgba(0,0,0,0));
    pointer-events: none;
  }
  .dock-in { max-width: 528px; margin: 0 auto; display: flex; gap: 10px; pointer-events: auto; }
  .timer-btn {
    flex: none; height: 56px; min-width: 56px; padding: 0 16px; border-radius: 28px; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--s2); border: 1px solid var(--line-2); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;
    transition: transform 0.12s ease, background-color 0.2s ease, color 0.2s ease;
  }
  .timer-btn:active { transform: scale(0.95); }
  .timer-btn svg.ico { width: 22px; height: 22px; }
  .timer-btn .ring { width: 22px; height: 22px; transform: rotate(-90deg); }
  .timer-btn .ring circle { fill: none; stroke-width: 2.5; }
  .timer-btn .ring .trk { stroke: var(--line-2); }
  .timer-btn .ring .bar { stroke: var(--a); stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; }
  .timer-btn.ding { background: var(--a); color: var(--on-a); animation: ding 0.6s ease 3; }
  @keyframes ding { 50% { transform: scale(1.06); } }
  .finish {
    flex: 1; height: 56px; border-radius: 28px; font-size: 17px; font-weight: 650; letter-spacing: -0.02em;
    background: var(--a); color: var(--on-a); display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 10px 30px color-mix(in srgb, var(--a) 28%, transparent);
    transition: transform 0.12s ease, background-color 0.2s ease, color 0.2s ease;
  }
  .finish:active { transform: scale(0.97); }
  .finish svg { width: 20px; height: 20px; }
  .finish.logged { background: var(--s2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 500; font-size: 15px; }
  .finish.logged b { color: var(--a); font-weight: 650; }

  /* Rest timer sheet */
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.55); opacity: 0; transition: opacity 0.22s ease; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-width: 560px; margin: 0 auto;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 16px); border-radius: 28px 28px 0 0;
    background: #121316; border-top: 1px solid var(--line-2);
    transform: translateY(105%); transition: transform 0.32s var(--ease);
  }
  .sheet-open .scrim { opacity: 1; }
  .sheet-open .sheet { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto 14px; }
  .sheet h4 { font-size: 20px; font-weight: 650; letter-spacing: -0.03em; padding: 0 4px; }
  .sheet p { font-size: 13.5px; color: var(--ink-3); padding: 2px 4px 0; }
  .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .opt { height: 72px; border-radius: 18px; background: var(--s2); font-size: 22px; font-weight: 650; letter-spacing: -0.03em; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.12s ease, background-color 0.12s ease; }
  .opt small { font-size: 11px; font-weight: 500; color: var(--ink-3); letter-spacing: 0.04em; }
  .opt:active { transform: scale(0.95); background: var(--s3); }
  .sheet-x { width: 100%; height: 52px; margin-top: 10px; border-radius: 16px; font-size: 16px; color: var(--ink-2); }
  .sheet-x:active { background: var(--s2); }

  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); z-index: 60;
    transform: translate(-50%, -140%); padding: 10px 16px; border-radius: 99px;
    background: var(--ink); color: #000; font-size: 14px; font-weight: 600; white-space: nowrap;
    display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform 0.4s var(--ease);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="workout-data.js"></script>
<script>
// ---------------------------------------------------------------------------
// Data + storage
// ---------------------------------------------------------------------------
const ROTATION = PROGRAMS.split.days;
const DAY = Object.fromEntries(ALL_DAYS.map(d => [d.id, d]));
const TYPE_NAME = { lower: "Lower", upper: "Upper", golf: "Golf" };

const store = {
  get(k, fallback) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fallback : v; } catch (e) { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

function ymd(dt) {
  const p = n => String(n).padStart(2, "0");
  return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}`;
}
function today() { return ymd(new Date()); }

// One entry per finished session. Nothing else is required: checking moves off
// along the way is optional, and a day's ticks clear themselves overnight.
let LOG = store.get("gp2-log", []);
let MARKS = store.get("gp2-marks", { date: "", on: {} });
function freshMarks() { if (MARKS.date !== today()) MARKS = { date: today(), on: {} }; }
freshMarks();

function loggedToday(id) { return LOG.some(e => e.d === today() && e.id === id); }
function lastDone(id) { for (let i = LOG.length - 1; i >= 0; i--) if (LOG[i].id === id) return LOG[i].d; return null; }

// Next in the Lower A > Upper A > Lower B > Upper B rotation, after the last one finished.
function upNext() {
  for (let i = LOG.length - 1; i >= 0; i--) {
    const k = ROTATION.indexOf(LOG[i].id);
    if (k >= 0) return ROTATION[(k + 1) % ROTATION.length];
  }
  return ROTATION[0];
}

function agoText(d) {
  if (!d) return "Not yet";
  const days = Math.round((new Date(today()) - new Date(d)) / 864e5);
  if (days <= 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 7) return `${days} days ago`;
  const w = Math.floor(days / 7);
  return w === 1 ? "Last week" : `${w} weeks ago`;
}

function sectionsFor(d) {
  const out = [];
  const wu = WARMUPS[d.id];
  if (wu && wu.length) out.push({ name: "Warm-up", sub: "", rows: wu, warm: true });
  d.phases.forEach(p => out.push({ name: p.name.charAt(0).toUpperCase() + p.name.slice(1), sub: p.sub || "", rows: p.rows }));
  return out;
}
function groupRows(rows) {
  const groups = [];
  rows.forEach(r => { if (r.ss !== "" || !groups.length) groups.push([r]); else groups[groups.length - 1].push(r); });
  return groups;
}
function workCount(d) { return d.phases.reduce((n, p) => n + p.rows.length, 0); }

// ---------------------------------------------------------------------------
// Small device niceties
// ---------------------------------------------------------------------------
// iOS has no vibrate API, but toggling a native <input switch> fires the system
// haptic (iOS 18+). Elsewhere it is a silent no-op.
const hapticLabel = (() => {
  const l = document.createElement("label"); l.style.display = "none"; l.setAttribute("aria-hidden", "true");
  const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch", ""); i.tabIndex = -1;
  l.appendChild(i); document.body.appendChild(l); return l;
})();
function haptic() {
  try { if (navigator.vibrate) navigator.vibrate(12); else hapticLabel.click(); } catch (e) {}
}

// Keep the screen on while a session is open, so the phone isn't locking between sets.
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && "wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}

let toastTimer;
function toast(html) {
  const t = document.getElementById("toast");
  t.innerHTML = html; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

const I = {
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev: '<svg class="chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4a1 1 0 0 0 1.5.86l11.5-7.2a1 1 0 0 0 0-1.72L8.5 3.94A1 1 0 0 0 7 4.8z"/></svg>',
  timer: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 2.5h5"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3a1 1 0 0 1 1 1v16.2a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1z"/><path d="M9.4 4.5h7.9a.7.7 0 0 1 .53 1.16l-2.2 2.52 2.2 2.53a.7.7 0 0 1-.53 1.16H9.4z"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg>',
  google: '<svg viewBox="0 0 488 512" fill="currentColor"><path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"/></svg>',
  podcasts: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="11" r="2"/><path d="M12 15v6M7.8 15.5a6 6 0 1 1 8.4 0M5 18.5a10 10 0 1 1 14 0"/></svg>',
  spotify: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0Zm5.51 17.31a.75.75 0 0 1-1.03.26c-2.83-1.73-6.39-2.12-10.58-1.16a.75.75 0 1 1-.33-1.46c4.58-1.05 8.51-.6 11.68 1.33.36.22.47.69.26 1.03Zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.24-1.99-8.18-2.57-12.01-1.4a.94.94 0 1 1-.55-1.8c4.38-1.33 9.83-.68 13.55 1.6.44.27.58.85.3 1.29Zm.13-3.4C15.6 8.2 9.48 8 5.78 9.14a1.13 1.13 0 1 1-.66-2.16c4.25-1.29 11.02-1.04 15.37 1.55a1.13 1.13 0 1 1-1.18 1.93Z"/></svg>'
};

// ---------------------------------------------------------------------------
// Home
// ---------------------------------------------------------------------------
function homeHtml() {
  const now = new Date();
  const weekday = now.toLocaleDateString("en-US", { weekday: "long" });
  const dateStr = now.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const nextId = upNext();
  const next = DAY[nextId];
  const doneToday = LOG.filter(e => e.d === today()).map(e => DAY[e.id]).filter(Boolean);
  const letter = next.label.slice(-1);

  const doneLine = doneToday.length
    ? `<div class="hero-done">${I.check}${doneToday.map(d => d.label).join(" + ")} done today</div>` : "";

  const hero = `
    <a class="hero" href="#${nextId}" data-letter="${letter}" style="--a:var(--${next.type})">
      <div class="kicker"><i></i>${doneToday.length ? "Up next" : "Today"}</div>
      <div class="hero-title">${next.label}</div>
      <div class="hero-focus">${next.focus}</div>
      ${doneLine}
      <div class="hero-foot">
        <div class="hero-stats">
          <div class="stat"><b class="num">${workCount(next)}</b><span>moves</span></div>
          <div class="stat"><b class="num">${next.phases.length}</b><span>blocks</span></div>
          <div class="stat"><b class="num">${(WARMUPS[nextId] || []).length}</b><span>warm-up</span></div>
        </div>
        <span class="go" aria-hidden="true">${I.arrow}</span>
      </div>
    </a>`;

  // Monday-first week strip
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  let weekCount = 0;
  const cells = [...Array(7)].map((_, i) => {
    const dt = new Date(monday); dt.setDate(monday.getDate() + i);
    const key = ymd(dt);
    const entry = [...LOG].reverse().find(e => e.d === key && DAY[e.id]);
    if (entry) weekCount++;
    const isToday = key === today();
    const cls = ["wd", isToday && "today", key > today() && "future", entry && "on"].filter(Boolean).join(" ");
    const dot = entry
      ? `<span class="wd-dot" style="background:var(--${DAY[entry.id].type})">${DAY[entry.id].type === "golf" ? "G" : DAY[entry.id].label.slice(-1)}</span>`
      : `<span class="wd-dot"></span>`;
    return `<div class="${cls}">${"MTWTFSS"[i]}${dot}</div>`;
  }).join("");
  const week = `
    <div class="week">
      <div class="week-head"><span class="label">This week</span><span class="week-count">${weekCount} ${weekCount === 1 ? "session" : "sessions"}</span></div>
      <div class="week-row">${cells}</div>
    </div>`;

  const card = id => {
    const d = DAY[id];
    const isNext = id === nextId;
    return `<a class="card" href="#${id}" style="--a:var(--${d.type})">
      <div class="card-letter">${d.label.slice(-1)}</div>
      <div class="card-focus">${d.focus}</div>
      <div class="card-foot"><span>${agoText(lastDone(id))}</span>${isNext ? '<span class="badge">Next</span>' : ""}</div>
    </a>`;
  };
  const group = (type, sub) => `
    <div class="group-h"><h2>${TYPE_NAME[type]}</h2><span>${sub}</span></div>
    <div class="pair">${ROTATION.filter(id => DAY[id].type === type).map(card).join("")}</div>`;

  const golf = DAY["pre-golf"];
  const golfCard = `
    <div class="group-h"><h2>Golf</h2><span>${agoText(lastDone("pre-golf"))}</span></div>
    <a class="card golf" href="#pre-golf" style="--a:var(--golf)">
      <span class="golf-ico">${I.flag}</span>
      <span class="golf-txt"><b>Pre-round mobility</b><span>${golf.focus}</span></span>
      ${I.chev}
    </a>`;

  const links = `
    <div class="group-h"><h2>More</h2></div>
    <div class="list">
      <a class="li" href="exercises.html"><span class="li-ico">${I.book}</span><span>Exercise library</span>${I.chev}</a>
      <a class="li" href="legacy.html"><span class="li-ico">${I.history}</span><span>Previous program</span>${I.chev}</a>
      <a class="li" href="fitbit://" target="_blank" rel="noopener"><span class="li-ico">${I.google}</span><span>Google Health</span>${I.chev}</a>
      <a class="li" href="podcasts://" target="_blank" rel="noopener"><span class="li-ico">${I.podcasts}</span><span>Apple Podcasts</span>${I.chev}</a>
      <a class="li" href="https://open.spotify.com" target="_blank" rel="noopener"><span class="li-ico">${I.spotify}</span><span>Spotify</span>${I.chev}</a>
    </div>`;

  return `<div class="home" style="--a:var(--${next.type})">
    <div class="h-top"><span class="wordmark">gym<b>pro</b></span><span class="h-date">${dateStr}</span></div>
    <h1 class="h-greet">${weekday}</h1>
    ${hero}
    ${week}
    ${group("lower", "Legs, power, sled")}
    ${group("upper", "Press, pull, arms")}
    ${golfCard}
    ${links}
  </div>`;
}

// ---------------------------------------------------------------------------
// Session
// ---------------------------------------------------------------------------
const BRACE_CUES = [
  "Ribs down, belly tight",
  "Brace before the first rep",
  "Tight middle, keep breathing",
  "Ribs stacked over hips",
  "Brace first, then move",
  "Squeeze abs and glutes"
];
// Keyed to the date so the wording holds for a whole session and changes between them.
function braceCue() { return BRACE_CUES[Math.floor(Date.now() / 864e5) % BRACE_CUES.length]; }

function fmtReps(rp) { return rp.replace(/(\d)\s*x\s*/gi, "$1 × "); }

function exHtml(r, label, key) {
  const [main, ...alts] = r.ex.split(/\s+OR\s+/);
  const alt = alts.length ? `<span class="ex-alt">or ${alts.join(" or ")}</span>` : "";
  const play = r.link ? `<a class="play" href="${r.link}" target="_blank" rel="noopener" aria-label="Demo: ${main}">${I.play}</a>` : "";
  const cues = [r.brace && braceCue(), r.posture].filter(Boolean).map(c => `<span class="cue">${c}</span>`).join("");
  const reps = r.rp ? `<span class="reps">${fmtReps(r.rp)}</span>` : "";
  const note = r.note ? `<div class="ex-note">${r.note}</div>` : "";
  const on = MARKS.on[key] ? " done" : "";
  return `<div class="ex${on}" data-key="${key}">
    <button class="ex-idx" aria-label="Mark ${main} done" aria-pressed="${!!on}"><span>${label}</span>${I.check}</button>
    <div class="ex-main">
      <div class="ex-top"><div class="ex-name">${main}${alt}</div>${play}</div>
      ${reps || cues ? `<div class="ex-meta">${reps}${cues}</div>` : ""}
      ${note}
    </div>
  </div>`;
}

function sessionHtml(d) {
  const secs = sectionsFor(d);
  const chips = secs.map((s, i) => `<button class="chip${i === 0 ? " on" : ""}" data-jump="${i}">${s.name}</button>`).join("");

  const body = secs.map((s, si) => {
    const groups = groupRows(s.rows);
    let inner;
    if (s.warm) {
      inner = `<div class="grp warm">${s.rows.map((r, ri) => exHtml(r, String(ri + 1), `${d.id}:${si}:${ri}`)).join("")}</div>`;
    } else {
      let ri = 0;
      inner = groups.map((g, gi) => {
        const multi = g.length > 1;
        const auto = multi ? (g.length >= 4 ? "Giant set" : g.length === 3 ? "Tri-set" : "Superset") : "";
        const tagText = g[0].tag || auto;
        const tag = tagText ? `<div class="grp-tag">${tagText}</div>` : "";
        const rows = g.map((r, k) => exHtml(r, (gi + 1) + (multi ? "ABCDEFG"[k] : ""), `${d.id}:${si}:${ri++}`)).join("");
        return `<div class="grp${multi ? " multi" : ""}">${tag}${rows}</div>`;
      }).join("");
    }
    const count = s.rows.length;
    return `<section class="sec" id="sec-${si}">
      <div class="sec-h"><span class="sec-n">${String(si + 1).padStart(2, "0")}</span><h3>${s.name}</h3><span class="sec-c">${count} ${count === 1 ? "move" : "moves"}</span></div>
      ${s.sub ? `<div class="sec-sub">${s.sub}</div>` : ""}
      <div class="grps">${inner}</div>
    </section>`;
  }).join("");

  const wu = (WARMUPS[d.id] || []).length;
  return `<div class="session" style="--a:var(--${d.type})" data-day="${d.id}">
    <header class="topbar" id="topbar"><div class="topbar-in">
      <button class="back" data-back aria-label="Back">${I.back}Today</button>
      <div class="tb-title">${d.label}</div>
      <div class="tb-right num" id="tb-count"></div>
    </div></header>
    <div class="s-glow"></div>
    <div class="s-hero">
      <div class="kicker"><i></i>${d.type === "golf" ? "Before the round" : TYPE_NAME[d.type] + " body"}</div>
      <h1 class="s-title" id="s-title">${d.label}</h1>
      <div class="s-focus">${d.focus}</div>
      <div class="s-stats">
        <div class="stat"><b class="num">${workCount(d)}</b><span>moves</span></div>
        <div class="stat"><b class="num">${d.phases.length}</b><span>blocks</span></div>
        ${wu ? `<div class="stat"><b class="num">${wu}</b><span>warm-up</span></div>` : ""}
        <div class="stat"><b>${agoText(lastDone(d.id))}</b><span>last done</span></div>
      </div>
    </div>
    <nav class="jump" id="jump" aria-label="Sections">${chips}</nav>
    ${body}
    <div class="dock"><div class="dock-in">
      <button class="timer-btn" id="timer-btn" aria-label="Rest timer"></button>
      <button class="finish" id="finish"></button>
    </div></div>
  </div>`;
}

function updateCount() {
  const el = document.getElementById("tb-count");
  if (!el) return;
  const all = document.querySelectorAll(".ex").length;
  const done = document.querySelectorAll(".ex.done").length;
  el.textContent = done ? `${done} / ${all}` : "";
}

function updateFinish() {
  const btn = document.getElementById("finish");
  if (!btn) return;
  const id = document.querySelector(".session").dataset.day;
  const logged = loggedToday(id);
  btn.classList.toggle("logged", logged);
  btn.innerHTML = logged ? `<b>Logged today</b>&nbsp;&middot; Undo` : `${I.check}Finish session`;
}

function toggleFinish() {
  const id = document.querySelector(".session").dataset.day;
  if (loggedToday(id)) {
    LOG = LOG.filter(e => !(e.d === today() && e.id === id));
    store.set("gp2-log", LOG);
    updateFinish();
    return;
  }
  LOG.push({ d: today(), id });
  store.set("gp2-log", LOG);
  haptic();
  updateFinish();
  toast(`${I.check}${DAY[id].label} logged`);
  setTimeout(goHome, 650);
}

// Section jump bar + title reveal, driven from one rAF-throttled scroll handler
let ticking = false;
function onScroll() {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const top = document.getElementById("topbar");
    if (!top) return;
    const th = top.getBoundingClientRect().height;
    top.classList.toggle("scrolled", window.scrollY > 4);
    const title = document.getElementById("s-title");
    top.classList.toggle("titled", title.getBoundingClientRect().bottom < th);
    const jump = document.getElementById("jump");
    const line = th + jump.getBoundingClientRect().height + 24;
    const secs = [...document.querySelectorAll(".sec")];
    let cur = 0;
    secs.forEach((s, i) => { if (s.getBoundingClientRect().top <= line) cur = i; });
    // Bottom of the page: last section wins even if it's too short to reach the line
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = secs.length - 1;
    setChip(cur);
  });
}
let activeChip = 0;
function setChip(i) {
  if (i === activeChip) return;
  activeChip = i;
  const chips = [...document.querySelectorAll(".chip")];
  chips.forEach((c, k) => c.classList.toggle("on", k === i));
  const c = chips[i], jump = document.getElementById("jump");
  if (c && jump) jump.scrollTo({ left: c.offsetLeft - 16, behavior: scrollMode() });
}
function scrollMode() { return matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"; }

// ---------------------------------------------------------------------------
// Rest timer
// ---------------------------------------------------------------------------
let TIMER = null;          // { end, dur }
let timerTick = null;
const RING_C = 2 * Math.PI * 9;

function renderTimer() {
  const btn = document.getElementById("timer-btn");
  if (!btn) return;
  if (btn.classList.contains("ding")) return;
  if (!TIMER) { btn.innerHTML = I.timer; btn.setAttribute("aria-label", "Rest timer"); return; }
  const left = Math.max(0, Math.ceil((TIMER.end - Date.now()) / 1000));
  const frac = Math.max(0, (TIMER.end - Date.now()) / (TIMER.dur * 1000));
  const m = Math.floor(left / 60), s = String(left % 60).padStart(2, "0");
  btn.setAttribute("aria-label", `Rest ${m}:${s} left, tap to stop`);
  btn.innerHTML = `<svg class="ring" viewBox="0 0 22 22"><circle class="trk" cx="11" cy="11" r="9"/><circle class="bar" cx="11" cy="11" r="9" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C * (1 - frac)}"/></svg>${m}:${s}`;
}
function startTimer(sec) {
  TIMER = { end: Date.now() + sec * 1000, dur: sec };
  clearInterval(timerTick);
  timerTick = setInterval(() => {
    if (TIMER && Date.now() >= TIMER.end) { TIMER = null; clearInterval(timerTick); ding(); }
    renderTimer();
  }, 250);
  renderTimer();
}
function stopTimer() { TIMER = null; clearInterval(timerTick); renderTimer(); }
function ding() {
  haptic(); setTimeout(haptic, 220); setTimeout(haptic, 440);
  const btn = document.getElementById("timer-btn");
  if (!btn) return;
  btn.classList.add("ding"); btn.textContent = "Go";
  setTimeout(() => { btn.classList.remove("ding"); renderTimer(); }, 2000);
}

function openSheet() {
  closeSheet(true);
  const wrap = document.createElement("div");
  wrap.id = "sheet";
  wrap.innerHTML = `<div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="Rest timer">
      <div class="grab"></div>
      <h4>Rest</h4><p>Counts down here, buzzes when it's time.</p>
      <div class="opts">${[30, 60, 90, 120].map(s => `<button class="opt" data-rest="${s}">${s < 60 ? s : s / 60 + (s % 60 ? ".5" : "")}<small>${s < 60 ? "SEC" : "MIN"}</small></button>`).join("")}</div>
      <button class="sheet-x" data-close>Cancel</button>
    </div>`;
  document.body.appendChild(wrap);
  requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("sheet-open")));
}
function closeSheet(instant) {
  const el = document.getElementById("sheet");
  if (!el) return;
  document.body.classList.remove("sheet-open");
  if (instant) el.remove(); else setTimeout(() => el.remove(), 320);
}

// ---------------------------------------------------------------------------
// Routing: #<day-id> opens a session, empty hash is home.
// ---------------------------------------------------------------------------
history.scrollRestoration = "manual";
let homeScroll = 0;
let navDir = null;          // set when the app itself navigates, so it can animate
let cameFromHome = false;

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  return DAY[id] ? id : null;
}

function render() {
  const id = route();
  const app = document.getElementById("app");
  closeSheet(true);
  if (id) {
    app.innerHTML = sessionHtml(DAY[id]);
    activeChip = 0;
    window.scrollTo(0, 0);
    updateCount(); updateFinish(); renderTimer();
    keepAwake(true);
  } else {
    app.innerHTML = homeHtml();
    window.scrollTo(0, homeScroll);
    keepAwake(false);
  }
  onScroll();
}

function navigate(fn, dir) {
  const html = document.documentElement;
  if (!dir || !document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    fn();
    if (dir) document.getElementById("app").firstElementChild.classList.add("enter");
    return;
  }
  html.classList.add(dir === "fwd" ? "vt-fwd" : "vt-back");
  const t = document.startViewTransition(fn);
  t.finished.finally(() => html.classList.remove("vt-fwd", "vt-back"));
}

window.addEventListener("hashchange", () => {
  // A hash change the app didn't start is the browser's own back/forward swipe,
  // which already animated - so no second animation on top of it.
  const dir = navDir; navDir = null;
  navigate(render, dir);
});

function openDay(id) {
  if (!route()) homeScroll = window.scrollY;
  cameFromHome = true;
  navDir = "fwd";
  location.hash = id;
}
function goHome() {
  if (!route()) return;
  navDir = "back";
  if (cameFromHome) { cameFromHome = false; history.back(); }
  else { history.replaceState(null, "", location.pathname + location.search); navDir = null; navigate(render, "back"); }
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------
document.addEventListener("click", e => {
  const t = e.target;
  const dayLink = t.closest('a[href^="#"]');
  if (dayLink) { e.preventDefault(); haptic(); openDay(dayLink.getAttribute("href").slice(1)); return; }
  if (t.closest("[data-back]")) { goHome(); return; }

  const idx = t.closest(".ex-idx");
  if (idx) {
    const ex = idx.closest(".ex");
    const on = !ex.classList.contains("done");
    ex.classList.toggle("done", on);
    idx.setAttribute("aria-pressed", String(on));
    freshMarks();
    if (on) MARKS.on[ex.dataset.key] = 1; else delete MARKS.on[ex.dataset.key];
    store.set("gp2-marks", MARKS);
    if (on) haptic();
    updateCount();
    return;
  }
  const note = t.closest(".ex-note");
  if (note) { note.classList.toggle("open"); return; }

  const chip = t.closest("[data-jump]");
  if (chip) {
    const sec = document.getElementById("sec-" + chip.dataset.jump);
    const th = document.getElementById("topbar").getBoundingClientRect().height;
    const jh = document.getElementById("jump").getBoundingClientRect().height;
    window.scrollTo({ top: sec.getBoundingClientRect().top + window.scrollY - th - jh - 6, behavior: scrollMode() });
    setChip(+chip.dataset.jump);
    return;
  }

  if (t.closest("#finish")) { toggleFinish(); return; }
  if (t.closest("#timer-btn")) { if (TIMER) stopTimer(); else openSheet(); return; }
  const rest = t.closest("[data-rest]");
  if (rest) { startTimer(+rest.dataset.rest); haptic(); closeSheet(); return; }
  if (t.closest("[data-close]")) { closeSheet(); return; }
});

window.addEventListener("scroll", onScroll, { passive: true });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (route()) keepAwake(true);
  // Came back the next morning with the app still open: clear yesterday's ticks
  if (MARKS.date !== today()) { freshMarks(); store.set("gp2-marks", MARKS); render(); }
  renderTimer();
});

// Edge swipe back. In the home-screen app there's no browser gesture to lean on,
// so a swipe in from the left edge does what the Back button does.
let swipe = null;
document.addEventListener("touchstart", e => {
  const p = e.touches[0];
  swipe = route() && p.clientX < 24 ? { x: p.clientX, y: p.clientY } : null;
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!swipe) return;
  const p = e.changedTouches[0];
  if (p.clientX - swipe.x > 70 && Math.abs(p.clientY - swipe.y) < 60) goHome();
  swipe = null;
}, { passive: true });

render();
</script>
</body>
</html>
